# Render Blueprint — SYNOP (Agentes de IA)
# Uso: conecte este repositório no Render (Blueprints) ou crie um Web Service
# apontando para a branch desejada com os campos abaixo.
#
# Referência técnica: mesmo padrão do projeto Aniversario_mari (web service
# Python), adaptado para FastAPI + dashboard compilado (Vite/React).

services:
  - type: web
    name: synop
    runtime: python
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
      cd dashboard
      npm ci || npm install
      npm run build
      test -f dist/index.html || (echo "FALHA: dashboard/dist/index.html nao foi gerado" && exit 1)
      cd ..
    startCommand: uvicorn nemo_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AUTH_SECRET
        sync: false
        # OBRIGATORIO no Render: python -c "import secrets;
        # print(secrets.token_urlsafe(48))"
        # Sem isso o app gera um segredo aleatorio por instancia e todas as
        # sessoes caem a cada novo deploy. NUNCA reutilize o valor local.
      - key: NEMO_ADMIN_EMAIL
        sync: false
        # E-mail do usuario ADMIN inicial (unico autorizado a criar contas)
      - key: OPENROUTER_API_KEY
        sync: false
        # Preencha no painel do Render: Settings → Environment → Add ->
        # chave criada em https://openrouter.ai/keys (formato sk-or-v1-...)
      - key: OPENROUTER_HTTP_REFERER
        sync: false
        # Opcional: URL pública do serviço após o primeiro deploy
      - key: OPENROUTER_APP_TITLE
        value: SYNOP
      - key: CORS_ORIGINS
        sync: false
        # Opcional: origens extras separadas por vírgula (ex.: seu domínio custom)
      - key: SUPABASE_URL
        sync: false
        # URL do projeto (ex.: https://xxxx.supabase.co) — dados persistidos
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
        # Service role do projeto (Settings → API). NUNCA no frontend.
      - key: NEMO_OPEN_REGISTRATION
        sync: false
        # 0 = desativa cadastro aberto (só ADMIN cria contas)